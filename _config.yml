# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: iomz.github.io
title_separator: "|"
name: "Iori Mizutani"
email: iori.mizutani@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Hazy beers (see my <a href="https://untappd.com/user/iomz">Untapped</a>), sauna, swimming, and <a href="https://www.youtube.com/playlist?list=PLAMNR9coa6gj50qeclfkDK9nPA9OH6dEg">Onewheeling</a>.
repository: "iomz/iomz.github.com"
breadcrumbs: true
github_username: iomz
twitter_username: iomz
minimal_mistakes_skin: contrast
locale: "en-US"
search: true
# https://github.com/marketplace/actions/algolia-jekyll-action
search_provider: algolia
algolia:
  application_id: SZL7OUO1ET
  index_name: iomz.github.io
  search_only_api_key: 2ac96d60fd849ffe1ac42e563af11c07
  powered_by: true # true (default), false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 10 # amount of posts to show
paginate_path: /page:num/
timezone: CET # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-CXPZRJMM1Y"
    anonymize_ip: false # default

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Iori Mizutani"
  avatar : "https://avatars2.githubusercontent.com/u/26181?s=460&v=4"
  bio    : "行动缓慢"
  links:
    #- label: "Website"
    #  icon: "fas fa-fw fa-link"
    #  url: "https://iomz.github.io"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/iomz"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/iomz"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/iomz"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/iomz"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/iomz"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/iomz"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
      toc: true
      #toc_icon: "cog"
      toc_sticky: true
      classes: wide
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

comments:
  provider: "disqus"
  disqus:
    shortname: "iomz"
